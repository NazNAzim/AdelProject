<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#355d49">
  <meta name="description" content="Liste familiale partagée pour préparer l'arrivée d'Adel.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="adel-icon.png">
  <title>Notre préparation pour Adel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{color-scheme:light}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f4f7f4,#fffaf4 48%,#fff);color:#304138}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.active{background:#416d57!important;color:#fff!important;border-color:#416d57!important}.modal{display:none}.modal.open{display:flex}.modal-panel{background:#fff;color:#1f2937}.modal-panel label{display:block;color:#374151;font-size:.875rem;font-weight:700}.modal-panel input,.modal-panel select,.modal-panel textarea{box-sizing:border-box;display:block;width:100%;margin-top:.375rem;padding:.75rem;color:#111827!important;-webkit-text-fill-color:#111827!important;background:#fff!important;border:1px solid #cbd5e1;border-radius:.75rem;caret-color:#111827;opacity:1}.modal-panel input::placeholder,.modal-panel textarea::placeholder{color:#94a3b8;opacity:1}.modal-panel input:focus,.modal-panel select:focus,.modal-panel textarea:focus{outline:3px solid rgba(245,158,11,.25);border-color:#d97706}.focus:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}@media print{.no-print{display:none!important}body{background:#fff}article{break-inside:avoid}}
  </style>
</head>
<body class="pb-12">
<header class="bg-gradient-to-br from-emerald-950 via-emerald-900 to-emerald-700 px-4 py-6 text-white">
  <div class="mx-auto max-w-6xl">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0"><p class="text-xs font-bold uppercase tracking-[.2em] text-emerald-100">Notre préparation</p><h1 class="mt-1 text-3xl font-black sm:text-4xl">🧸 Adel</h1><p id="headerMessage" class="mt-2 text-sm text-emerald-100"></p><button id="syncButton" type="button" class="focus mt-3 rounded-full bg-white/15 px-3 py-1.5 text-xs font-bold hover:bg-white/25">☁️ Mode local</button></div>
      <div class="flex shrink-0 items-center gap-2"><button id="settingsButton" type="button" aria-label="Paramètres" title="Paramètres" class="focus grid h-11 w-11 place-items-center rounded-xl bg-white/15 text-xl hover:bg-white/25">⚙️</button><button id="addButton" type="button" class="focus flex h-11 items-center gap-2 rounded-xl bg-white px-3 font-black text-emerald-900 shadow-lg hover:bg-emerald-50 sm:px-4"><span class="text-xl">＋</span><span class="hidden sm:inline">Ajouter</span></button></div>
    </div>
    <div class="mt-6"><div class="flex items-end justify-between gap-4"><div><strong id="progressPercent" class="text-3xl font-black">0 %</strong><span class="ml-1 text-sm text-emerald-100">prêt</span></div><span id="progressCount" class="max-w-[60%] text-right text-xs text-emerald-100 sm:text-sm"></span></div><div class="mt-2 h-3 w-full overflow-hidden rounded-full bg-white/20"><div id="progressBar" class="h-full rounded-full bg-amber-300 transition-all duration-300" style="width:0%"></div></div></div>
  </div>
</header>
<main class="mx-auto max-w-6xl px-4 py-5">
  <section id="kpiContainer" class="grid grid-cols-2 gap-3 md:grid-cols-4"></section>
  <nav id="mainNavigation" class="no-print sticky top-2 z-30 mt-5 flex gap-1 overflow-x-auto rounded-2xl border border-emerald-100 bg-white/95 p-1 shadow-lg backdrop-blur"><button data-view="home" class="main-tab active focus min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold">🏠 Accueil</button><button data-view="purchases" class="main-tab focus min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold">🛒 Achats</button><button data-view="planning" class="main-tab focus min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold">📅 Planning</button><button data-view="budget" class="main-tab focus min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold">€ Budget</button><button data-view="maternity" class="main-tab focus min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold">🏥 Maternité</button></nav>
  <section id="mainContent" class="py-6"></section>
</main>
<div id="toastContainer" class="pointer-events-none fixed bottom-6 left-1/2 z-[70] w-[min(92vw,420px)] -translate-x-1/2 space-y-2" aria-live="polite"></div>
<div id="modal" class="modal fixed inset-0 z-50 items-end justify-center bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel max-h-[94vh] w-full max-w-2xl overflow-y-auto rounded-t-3xl p-5 shadow-2xl sm:rounded-3xl sm:p-7"><div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white pb-4"><h2 id="modalTitle" class="text-2xl font-black text-slate-900"></h2><button id="closeModalButton" type="button" aria-label="Fermer" title="Fermer" class="focus grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-xl font-black text-slate-700 hover:bg-slate-200">✕</button></div><div id="modalBody" class="mt-5"></div></div></div>
<script>
'use strict';
const APP_VERSION=6,STORAGE_KEY='adel_v6',FAMILY_KEY='adel_family';
const CATEGORIES={vetements:{icon:'👕',label:'Vêtements'},sommeil:{icon:'🌙',label:'Sommeil'},soins:{icon:'🛁',label:'Soins'},sorties:{icon:'🚗',label:'Sorties'},eveil:{icon:'🧸',label:'Éveil & repas'},maternite:{icon:'🧳',label:'Maternité & démarches'}};
const TIMINGS=['À préparer maintenant','Avant le 15 décembre','Avant le 25 décembre','Valise maternité','Jour J • 1er janvier','Retour à la maison','1er mois','2 à 3 mois','Plus tard'];
const OWNERS=['Papa','Maman','Mamie Béa','Mamie Lydia','Papi Xav','Autre'];
const STATUS={buy:'À acheter',ordered:'Commandé',received:'Reçu'};
const ROWS=[['Bodies manches longues naissance/1 mois','vetements','Avant le 25 décembre',8,8],['Pyjamas chauds naissance/1 mois','vetements','Avant le 25 décembre',8,12],['Gilets ou brassières chaudes','vetements','Avant le 25 décembre',3,18],['Bonnets naissance','vetements','Valise maternité',2,8],['Chaussettes ou chaussons','vetements','Avant le 25 décembre',4,5],['Tenues 3 mois','vetements','1er mois',5,20],['Lit ou berceau conforme','sommeil','Avant le 15 décembre',1,150],['Matelas ferme adapté','sommeil','Avant le 15 décembre',1,70],['Draps-housses adaptés','sommeil','Avant le 25 décembre',3,15],['Alèses respirantes','sommeil','Avant le 25 décembre',2,15],['Gigoteuses hiver adaptées','sommeil','Avant le 25 décembre',2,35],['Couches taille naissance/1','soins','Avant le 25 décembre',3,12],['Carrés de coton ou lingettes lavables','soins','Avant le 25 décembre',2,10],['Produit de change','soins','Avant le 25 décembre',1,8],['Thermomètre électronique','soins','Avant le 25 décembre',1,15],['Sérum physiologique unidose','soins','Avant le 25 décembre',2,5],['Cape de bain','soins','Retour à la maison',2,15],['Matelas à langer sécurisé','soins','Avant le 25 décembre',1,70],['Coque/cosy R129 dès la naissance','sorties','Avant le 15 décembre',1,220],['Installer et tester le siège auto','sorties','Avant le 25 décembre',1,0],['Poussette compatible nouveau-né','sorties','Avant le 25 décembre',1,450],['Chancelière ou couverture de sortie','sorties','Avant le 25 décembre',1,60],['Sac à langer','sorties','Valise maternité',1,60],['Tapis d’éveil ferme','eveil','1er mois',1,45],['Biberons naissance si besoin','eveil','Retour à la maison',4,10],['Goupillon','eveil','Retour à la maison',1,8],['Bavoirs','eveil','Retour à la maison',6,5],['Dossier maternité et pièces d’identité','maternite','Valise maternité',1,0],['Tenue de naissance complète','maternite','Valise maternité',1,25],['Pyjamas et bodies pour le séjour','maternite','Valise maternité',5,12],['Gigoteuse maternité','maternite','Valise maternité',1,35],['Affaires confortables Maman','maternite','Valise maternité',1,90],['Nécessaire de toilette Maman','maternite','Valise maternité',1,30],['Chargeurs et encas parents','maternite','Valise maternité',1,20],['Déclaration de naissance','maternite','Jour J • 1er janvier',1,0],['Déclaration Assurance Maladie','maternite','Retour à la maison',1,0],['Déclaration CAF/MSA','maternite','Retour à la maison',1,0],['Prévenir les mutuelles','maternite','Retour à la maison',1,0],['Organiser le suivi postnatal','maternite','Retour à la maison',1,0]];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n)||0),uid=()=>crypto.randomUUID?.()||`custom-${Date.now()}-${Math.random()}`;
function initialState(){return{version:APP_VERSION,updatedAt:'',items:ROWS.map((r,n)=>({id:`base-${n}`,name:r[0],category:r[1],timing:r[2],qty:r[3],unit:r[4],got:0,paid:0,priority:['1er mois','2 à 3 mois','Plus tard'].includes(r[2])?'normal':'essential',status:'buy',owner:'Papa',notes:'',avoid:r[0].startsWith('Lit')?'Sans oreiller, couette, tour de lit, cale-bébé ni objet mou. Couchage sur le dos.':r[0].startsWith('Coque')?'Modèle R129 adapté dès la naissance, dos à la route et compatible avec la voiture.':''}))}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&Array.isArray(x.items)?x:initialState()}catch{return initialState()}}
let state=load(),view='home',category='',query='',status='',syncing=false,syncTimer,lastFocus;
function family(){return localStorage.getItem(FAMILY_KEY)||''}function item(id){return state.items.find(x=>x.id===id)}
function metrics(){let total=0,ready=0,est=0,paid=0;state.items.forEach(i=>{const q=Math.max(1,+i.qty||1),g=Math.min(q,Math.max(0,+i.got||0));total+=q;ready+=g;est+=q*(+i.unit||0);paid+=+i.paid||0});return{total,ready,remaining:total-ready,pct:total?Math.round(ready/total*100):0,est,paid,left:state.items.reduce((s,i)=>s+Math.max(0,(+i.qty||1)-(+i.got||0))*(+i.unit||0),0),urgent:state.items.filter(i=>i.priority==='essential'&&+i.got<+i.qty).length,ordered:state.items.filter(i=>i.status==='ordered').length}}
function toast(text){const d=document.createElement('div');d.className='pointer-events-auto rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold text-white shadow-2xl';d.textContent=text;$('#toastContainer').append(d);setTimeout(()=>d.remove(),3000)}
function syncText(text){$('#syncButton').textContent=text}
function persist(){state.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render();if(family()&&!syncing){clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,300)}}
async function pushCloud(){try{syncText('☁️ Synchronisation…');const r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(family()),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw Error(r.status);const saved=await r.json();state.updatedAt=saved.updatedAt||state.updatedAt;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));syncText('☁️ Partagé • à jour')}catch(e){console.error(e);syncText('⚠️ Hors connexion • local')}}
async function pullCloud(show=true){if(!family()){syncText('☁️ Mode local');return}try{if(show)syncText('☁️ Chargement partagé…');const r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(family()),{cache:'no-store'});if(r.status===404){await pushCloud();return}if(!r.ok)throw Error(r.status);const cloud=await r.json();if(cloud.items&&cloud.updatedAt>(state.updatedAt||'')){syncing=true;state=cloud;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render();syncing=false}syncText('☁️ Partagé • à jour')}catch(e){console.error(e);syncText('⚠️ Hors connexion • local')}}
function card(i){const c=CATEGORIES[i.category]||{icon:'📦',label:'Autre'},q=Math.max(1,+i.qty||1),g=Math.min(q,Math.max(0,+i.got||0)),done=g>=q;return `<article data-id="${esc(i.id)}" class="rounded-3xl border border-emerald-100 bg-white p-4 shadow-sm"><div class="flex gap-3"><button type="button" data-action="done" class="focus mt-1 grid h-7 w-7 shrink-0 place-items-center rounded-full border-2 border-emerald-700 ${done?'bg-emerald-700 text-white':''}">${done?'✓':''}</button><div class="min-w-0 flex-1"><div class="flex justify-between gap-3"><div><h3 class="font-black text-slate-800 ${done?'line-through opacity-50':''}">${esc(i.name)}</h3><p class="mt-1 text-xs text-slate-500">${c.icon} ${c.label} • ${esc(i.timing)}</p></div><button type="button" data-action="edit" class="focus rounded-xl px-2 text-xl">⋯</button></div><div class="mt-3 flex flex-wrap gap-2 text-xs font-bold">${i.priority==='essential'?'<span class="rounded-full bg-red-50 px-2 py-1 text-red-700">🚨 Indispensable</span>':''}<span class="rounded-full bg-emerald-50 px-2 py-1 text-emerald-800">${i.status==='ordered'?'🚚 Commandé':i.status==='received'?'✓ Reçu':'🛒 À acheter'}</span><span class="rounded-full bg-slate-100 px-2 py-1">👤 ${esc(i.owner||'Papa')}</span></div>${i.avoid?`<p class="mt-3 rounded-xl bg-amber-50 p-2 text-xs text-amber-900">⚠️ ${esc(i.avoid)}</p>`:''}<div class="mt-4 flex items-center justify-between gap-3"><div class="flex items-center overflow-hidden rounded-xl border"><button type="button" data-action="minus" class="px-3 py-2">−</button><strong class="min-w-16 text-center">${g} / ${q}</strong><button type="button" data-action="plus" class="px-3 py-2">＋</button></div><div class="text-right"><strong class="text-emerald-900">${eur(q*(+i.unit||0))}</strong>${+i.paid?`<p class="text-xs text-slate-500">Payé ${eur(i.paid)}</p>`:''}</div></div></div></div></article>`}
function filtered(){const q=query.trim().toLowerCase();return state.items.filter(i=>(!category||i.category===category)&&(!status||i.status===status)&&(!q||[i.name,i.timing,i.owner,i.notes,i.avoid,CATEGORIES[i.category]?.label].filter(Boolean).join(' ').toLowerCase().includes(q)))}
function renderResults(){const list=$('#purchaseList'),count=$('#resultCount');if(!list)return;const a=filtered();count.textContent=`${a.length} article${a.length>1?'s':''}`;list.innerHTML=a.length?a.map(card).join(''):'<p class="rounded-3xl bg-white p-8 text-center text-slate-500 md:col-span-2">Aucun article trouvé.</p>'}
function render(){const m=metrics();$('#progressPercent').textContent=m.pct+' %';$('#progressBar').style.width=m.pct+'%';$('#progressCount').textContent=`${m.ready} unités prêtes • ${m.remaining} restantes`;$('#headerMessage').textContent=m.urgent?`${m.urgent} indispensable${m.urgent>1?'s':''} à finaliser.`:'Tout est prêt.';$('#kpiContainer').innerHTML=[['🚨',m.urgent,'Indispensables'],['🚚',m.ordered,'Commandés'],['€',eur(m.left),'Restant estimé'],['✓',m.ready+'/'+m.total,'Unités prêtes']].map(x=>`<div class="rounded-3xl border border-emerald-100 bg-white p-4 shadow-sm"><div>${x[0]}</div><strong class="mt-2 block text-xl text-emerald-900">${x[1]}</strong><p class="text-xs text-slate-500">${x[2]}</p></div>`).join('');const c=$('#mainContent');if(view==='home'){const a=state.items.filter(i=>+i.got<+i.qty).sort((a,b)=>(a.priority==='essential'?-1:1)-(b.priority==='essential'?-1:1));c.innerHTML=`<div class="flex justify-between"><h2 class="text-2xl font-black">🎯 Notre priorité</h2><button data-go="purchases" class="font-bold text-emerald-800">Voir tout →</button></div><div class="mt-4 grid gap-3 md:grid-cols-2">${a.slice(0,8).map(card).join('')||'<p>🎉 Tout est prêt !</p>'}</div>`}else if(view==='purchases'){c.innerHTML=`<h2 class="text-2xl font-black">🛒 Nos achats</h2><div class="mt-4 rounded-3xl bg-white p-3 shadow-sm"><div class="relative"><input id="searchInput" type="search" autocomplete="off" class="w-full rounded-2xl bg-emerald-50 py-3 pl-4 pr-12 text-slate-900 outline-none ring-1 ring-emerald-100 focus:ring-2 focus:ring-emerald-600" placeholder="🔍 Rechercher un article…" value="${esc(query)}"><button id="clearSearch" type="button" aria-label="Vider la recherche" class="${query?'grid':'hidden'} absolute right-2 top-1/2 h-9 w-9 -translate-y-1/2 place-items-center rounded-full bg-white font-black text-slate-600 shadow">✕</button></div><div class="mt-3 flex gap-2 overflow-auto"><button data-category="" class="category ${!category?'active':''} min-w-max rounded-full border px-3 py-2 text-xs font-bold">Voir tout</button>${Object.entries(CATEGORIES).map(([id,x])=>`<button data-category="${id}" class="category ${category===id?'active':''} min-w-max rounded-full border px-3 py-2 text-xs font-bold">${x.icon} ${x.label}</button>`).join('')}</div><div class="mt-3 flex flex-wrap gap-2">${[['','Tous statuts'],['buy','🛒 À acheter'],['ordered','🚚 Commandés'],['received','✓ Reçus']].map(x=>`<button data-status="${x[0]}" class="status ${status===x[0]?'active':''} rounded-full border px-3 py-2 text-xs font-bold">${x[1]}</button>`).join('')}</div></div><p id="resultCount" class="mt-4 text-sm text-slate-500"></p><div id="purchaseList" class="mt-3 grid gap-3 md:grid-cols-2"></div>`;renderResults()}else if(view==='planning'){c.innerHTML=`<h2 class="text-2xl font-black">📅 Notre planning</h2>${TIMINGS.map(t=>`<section class="mt-6"><h3 class="font-black">${esc(t)}</h3><div class="mt-3 grid gap-3 md:grid-cols-2">${state.items.filter(i=>i.timing===t).map(card).join('')||'<p class="text-slate-400">Aucun article</p>'}</div></section>`).join('')}`}else if(view==='budget'){c.innerHTML=`<h2 class="text-2xl font-black">€ Notre budget</h2><div class="mt-4 grid gap-3 md:grid-cols-3"><div class="rounded-3xl bg-white p-5">Prévisionnel<strong class="block text-2xl">${eur(m.est)}</strong></div><div class="rounded-3xl bg-white p-5">Dépensé<strong class="block text-2xl">${eur(m.paid)}</strong></div><div class="rounded-3xl bg-white p-5">Restant estimé<strong class="block text-2xl">${eur(m.left)}</strong></div></div>`}else{const a=state.items.filter(i=>i.category==='maternite');c.innerHTML=`<h2 class="text-2xl font-black">🏥 Notre valise et nos démarches</h2><div class="mt-4 grid gap-3 md:grid-cols-2">${a.map(card).join('')}</div>`}}
function openModal(title,html){lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#modalBody input, #modalBody select, #modalBody button')?.focus(),0)}function closeModal(){$('#modal').classList.remove('open');$('#modalBody').innerHTML='';document.body.style.overflow='';lastFocus?.focus?.()}
function openItem(existing=null){const x=existing||{name:'',category:'vetements',timing:TIMINGS[0],qty:1,unit:0,got:0,paid:0,priority:'normal',status:'buy',owner:'Papa',notes:'',avoid:''};openModal(existing?'Modifier l’article':'Ajouter un article',`<form id="itemForm" class="grid gap-4 sm:grid-cols-2"><label class="sm:col-span-2">Nom de l’article<input required name="name" value="${esc(x.name)}" placeholder="Ex. Couverture"></label><label>Catégorie<select name="category">${Object.entries(CATEGORIES).map(([id,c])=>`<option value="${id}" ${x.category===id?'selected':''}>${c.icon} ${c.label}</option>`).join('')}</select></label><label>Échéance<select name="timing">${TIMINGS.map(t=>`<option ${x.timing===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>Quantité souhaitée<input required name="qty" type="number" min="1" value="${+x.qty||1}"></label><label>Prix unitaire estimé<input name="unit" type="number" min="0" step=".01" value="${+x.unit||0}"></label><label>Quantité déjà obtenue<input name="got" type="number" min="0" value="${+x.got||0}"></label><label>Montant payé<input name="paid" type="number" min="0" step=".01" value="${+x.paid||0}"></label><label>Responsable<select name="owner">${OWNERS.map(o=>`<option ${x.owner===o?'selected':''}>${o}</option>`).join('')}</select></label><label>Statut<select name="status">${Object.entries(STATUS).map(([id,l])=>`<option value="${id}" ${x.status===id?'selected':''}>${l}</option>`).join('')}</select></label><label>Priorité<select name="priority"><option value="essential" ${x.priority==='essential'?'selected':''}>Indispensable</option><option value="normal" ${x.priority==='normal'?'selected':''}>Normale</option></select></label><label class="sm:col-span-2">À éviter<input name="avoid" value="${esc(x.avoid||'')}"></label><label class="sm:col-span-2">Notes<textarea name="notes" rows="3">${esc(x.notes||'')}</textarea></label><div class="sm:col-span-2 flex flex-wrap justify-between gap-3 border-t pt-4"><div>${existing?'<button id="deleteItem" type="button" class="rounded-xl px-4 py-2 font-bold text-red-600">Supprimer</button>':''}</div><div class="flex gap-2"><button id="cancelItem" type="button" class="rounded-xl border px-4 py-2 font-bold">Annuler</button><button type="submit" class="rounded-xl bg-emerald-800 px-5 py-2 font-bold text-white">Enregistrer</button></div></div></form>`);const f=$('#itemForm');$('#cancelItem').onclick=closeModal;f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));for(const k of ['qty','unit','got','paid'])o[k]=Number(o[k])||0;o.qty=Math.max(1,o.qty);o.got=Math.min(o.qty,Math.max(0,o.got));if(o.got>=o.qty)o.status='received';if(existing){Object.assign(existing,o);toast('Article mis à jour')}else{state.items.unshift({id:uid(),...o});toast('Article ajouté')}closeModal();persist()};if(existing)$('#deleteItem').onclick=()=>{if(confirm(`Supprimer « ${existing.name} » ?`)){state.items=state.items.filter(i=>i.id!==existing.id);closeModal();persist();toast('Article supprimé')}}}
function settings(){openModal('Paramètres',`<div class="space-y-5"><div class="rounded-2xl bg-emerald-50 p-4"><label>Code famille partagé<input id="familyInput" type="password" value="${esc(family())}" placeholder="Au moins 10 caractères"></label><p class="mt-2 text-xs text-slate-600">Utilisez exactement le même code privé sur les deux appareils.</p><button id="saveFamily" type="button" class="mt-4 w-full rounded-xl bg-emerald-800 p-3 font-bold text-white">Enregistrer et synchroniser</button></div><button id="exportData" type="button" class="w-full rounded-xl border p-3 font-bold">Exporter une sauvegarde JSON</button></div>`);$('#saveFamily').onclick=()=>{const code=$('#familyInput').value.trim();if(code&&code.length<10){toast('Le code doit contenir au moins 10 caractères');return}localStorage.setItem(FAMILY_KEY,code);closeModal();code?pullCloud():syncText('☁️ Mode local')};$('#exportData').onclick=exportData}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download=`adel-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Sauvegarde exportée')}
function openView(v){view=v;$$('.main-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
$('#mainNavigation').onclick=e=>{const b=e.target.closest('[data-view]');if(b)openView(b.dataset.view)};
$('#mainContent').oninput=e=>{if(e.target.id==='searchInput'){query=e.target.value;const b=$('#clearSearch');if(b){b.classList.toggle('hidden',!query);b.classList.toggle('grid',!!query)}renderResults()}};
$('#mainContent').onclick=e=>{if(e.target.closest('#clearSearch')){query='';$('#searchInput').value='';$('#searchInput').focus();$('#clearSearch').classList.add('hidden');renderResults();return}const go=e.target.closest('[data-go]');if(go){openView(go.dataset.go);return}const cb=e.target.closest('[data-category]');if(cb){category=cb.dataset.category;$$('.category').forEach(b=>b.classList.toggle('active',b===cb));renderResults();return}const sb=e.target.closest('[data-status]');if(sb){status=sb.dataset.status;$$('.status').forEach(b=>b.classList.toggle('active',b===sb));renderResults();return}const box=e.target.closest('[data-id]'),ab=e.target.closest('[data-action]');if(!box||!ab)return;const i=item(box.dataset.id),a=ab.dataset.action;if(!i)return;if(a==='edit'){openItem(i);return}if(a==='plus')i.got=Math.min(+i.qty,+i.got+1);if(a==='minus')i.got=Math.max(0,+i.got-1);if(a==='done')i.got=+i.got>=+i.qty?0:+i.qty;i.status=+i.got>=+i.qty?'received':'buy';persist()};
$('#addButton').onclick=()=>openItem();$('#settingsButton').onclick=settings;$('#syncButton').onclick=()=>family()?pullCloud():settings();$('#closeModalButton').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal()});
render();pullCloud();setInterval(()=>pullCloud(false),10000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body>
