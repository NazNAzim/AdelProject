<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355d49"><link rel="manifest" href="manifest.webmanifest"><title>Notre préparation pour Adel</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f4f7f4;color:#304138}.on{background:#416d57!important;color:#fff}.modal{display:none}.modal.on{display:flex}</style></head><body class="min-h-screen">
<header class="relative bg-gradient-to-br from-emerald-950 to-emerald-700 px-4 py-6 text-white"><div class="mx-auto max-w-6xl pr-28"><p class="text-xs font-bold uppercase tracking-[.2em]">Notre préparation</p><h1 class="text-4xl font-black">🧸 Adel</h1><p id="message" class="mt-2"></p><button id="syncBtn" type="button" class="mt-3 rounded-full bg-white/15 px-3 py-1 text-xs font-bold">☁️ Mode local</button><div class="mt-5 flex justify-between"><b id="pct" class="text-3xl">0 %</b><span id="count"></span></div><div class="mt-2 h-3 rounded-full bg-white/20"><div id="bar" class="h-full rounded-full bg-amber-300"></div></div></div><button id="addBtn" type="button" class="fixed right-4 top-4 z-40 rounded-2xl bg-white px-4 py-3 font-black text-emerald-900 shadow-xl">＋ <span class="hidden sm:inline">Ajouter</span></button></header>
<main class="mx-auto max-w-6xl p-4"><div id="kpis" class="grid grid-cols-2 gap-3 py-5 md:grid-cols-4"></div><nav id="tabs" class="sticky top-2 z-20 flex gap-1 overflow-auto rounded-2xl bg-white/95 p-1 shadow"><button data-v="home" class="tab on rounded-xl px-4 py-3 font-bold">🏠 Accueil</button><button data-v="buy" class="tab rounded-xl px-4 py-3 font-bold">🛒 Achats</button><button data-v="plan" class="tab rounded-xl px-4 py-3 font-bold">📅 Planning</button><button data-v="budget" class="tab rounded-xl px-4 py-3 font-bold">€ Budget</button><button data-v="maternity" class="tab rounded-xl px-4 py-3 font-bold">🏥 Maternité</button></nav><section id="content" class="py-6"></section></main>
<div id="modal" class="modal fixed inset-0 z-50 items-end justify-center bg-black/40 p-0 sm:items-center sm:p-4"><div class="max-h-[94vh] w-full max-w-2xl overflow-auto rounded-t-3xl bg-white p-6 shadow-2xl sm:rounded-3xl"><div class="flex items-center justify-between"><h2 id="modalTitle" class="text-2xl font-black"></h2><button id="closeModal" type="button" aria-label="Fermer" class="rounded-xl px-3 py-2 text-xl hover:bg-slate-100">✕</button></div><div id="modalBody" class="mt-5"></div></div></div>
<script>
const KEY='adel_v6',FKEY='adel_family';
const CATS={vetements:['👕','Vêtements'],sommeil:['🌙','Sommeil'],soins:['🛁','Soins'],sorties:['🚗','Sorties'],eveil:['🧸','Éveil & repas'],maternite:['🧳','Maternité & démarches']};
const TIMES=['À préparer maintenant','Avant le 15 décembre','Avant le 25 décembre','Valise maternité','Jour J • 1er janvier','Retour à la maison','1er mois','2 à 3 mois','Plus tard'];
const OWNERS=['Papa','Maman','Mamie Béa','Mamie Lydia','Papi Xav','Autre'];
const rows=[['Bodies manches longues naissance/1 mois','vetements','Avant le 25 décembre',8,8],['Pyjamas chauds naissance/1 mois','vetements','Avant le 25 décembre',8,12],['Gilets/brassières chaudes','vetements','Avant le 25 décembre',3,18],['Bonnets naissance','vetements','Valise maternité',2,8],['Chaussettes/chaussons','vetements','Avant le 25 décembre',4,5],['Tenues 3 mois','vetements','1er mois',5,20],['Lit ou berceau conforme','sommeil','Avant le 15 décembre',1,150],['Matelas ferme adapté','sommeil','Avant le 15 décembre',1,70],['Draps-housses','sommeil','Avant le 25 décembre',3,15],['Alèses respirantes','sommeil','Avant le 25 décembre',2,15],['Gigoteuses hiver adaptées','sommeil','Avant le 25 décembre',2,35],['Couches taille naissance/1','soins','Avant le 25 décembre',3,12],['Carrés de coton ou lingettes lavables','soins','Avant le 25 décembre',2,10],['Produit de change','soins','Avant le 25 décembre',1,8],['Thermomètre électronique','soins','Avant le 25 décembre',1,15],['Sérum physiologique unidose','soins','Avant le 25 décembre',2,5],['Cape de bain','soins','Retour à la maison',2,15],['Matelas à langer sécurisé','soins','Avant le 25 décembre',1,70],['Coque/cosy R129 dès la naissance','sorties','Avant le 15 décembre',1,220],['Installer et tester le siège auto','sorties','Avant le 25 décembre',1,0],['Poussette nouveau-né','sorties','Avant le 25 décembre',1,450],['Chancelière/couverture de sortie','sorties','Avant le 25 décembre',1,60],['Sac à langer','sorties','Valise maternité',1,60],['Tapis d’éveil ferme','eveil','1er mois',1,45],['Biberons naissance si besoin','eveil','Retour à la maison',4,10],['Goupillon','eveil','Retour à la maison',1,8],['Bavoirs','eveil','Retour à la maison',6,5],['Dossier maternité et pièces d’identité','maternite','Valise maternité',1,0],['Tenue de naissance complète','maternite','Valise maternité',1,25],['Pyjamas/bodies pour le séjour','maternite','Valise maternité',5,12],['Gigoteuse maternité','maternite','Valise maternité',1,35],['Affaires confortables Maman','maternite','Valise maternité',1,90],['Nécessaire toilette Maman','maternite','Valise maternité',1,30],['Chargeurs et encas parents','maternite','Valise maternité',1,20],['Déclaration de naissance','maternite','Jour J • 1er janvier',1,0],['Déclaration Assurance Maladie','maternite','Retour à la maison',1,0],['Déclaration CAF/MSA','maternite','Retour à la maison',1,0],['Prévenir les mutuelles','maternite','Retour à la maison',1,0],['Organiser le suivi postnatal','maternite','Retour à la maison',1,0]];
const fresh=()=>({version:6,updatedAt:'',items:rows.map((r,n)=>({id:'base-'+n,name:r[0],category:r[1],timing:r[2],qty:r[3],unit:r[4],got:0,paid:0,priority:['1er mois','2 à 3 mois','Plus tard'].includes(r[2])?'normal':'essential',status:'buy',owner:'Papa',avoid:r[0].startsWith('Lit')?'Sans oreiller, couette, tour de lit, cale-bébé ni objet mou. Couchage sur le dos.':r[0].startsWith('Coque')?'Modèle R129 adapté dès la naissance, dos à la route et compatible avec la voiture.':''}))});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}let view='home',category='',query='',syncing=false,syncTimer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0),family=()=>localStorage.getItem(FKEY)||'';
function calc(){let total=0,ready=0,est=0,paid=0;for(const i of state.items){total+=i.qty;ready+=Math.min(i.qty,i.got);est+=i.qty*i.unit;paid+=i.paid}return{total,ready,pct:total?Math.round(ready/total*100):0,est,paid,left:state.items.reduce((s,i)=>s+Math.max(0,i.qty-i.got)*i.unit,0),urgent:state.items.filter(i=>i.priority==='essential'&&i.got<i.qty).length,ordered:state.items.filter(i=>i.status==='ordered').length}}
function persist(){state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));render();if(family()&&!syncing){clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,250)}}
async function pushCloud(){try{$('#syncBtn').textContent='☁️ Synchronisation…';const r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(family()),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw Error();const saved=await r.json();state.updatedAt=saved.updatedAt;localStorage.setItem(KEY,JSON.stringify(state));$('#syncBtn').textContent='☁️ Partagé • à jour'}catch{$('#syncBtn').textContent='⚠️ Hors connexion • local'}}
async function pullCloud(){if(!family())return $('#syncBtn').textContent='☁️ Mode local';try{const r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(family()),{cache:'no-store'});if(r.status===404)return pushCloud();if(!r.ok)throw Error();const cloud=await r.json();if(cloud.updatedAt&&(!state.updatedAt||cloud.updatedAt>state.updatedAt)){syncing=true;state=cloud;localStorage.setItem(KEY,JSON.stringify(state));render();syncing=false}$('#syncBtn').textContent='☁️ Partagé • à jour'}catch{$('#syncBtn').textContent='⚠️ Hors connexion • local'}}
function itemCard(i){const c=CATS[i.category]||['📦','Autre'];return `<article class="rounded-3xl bg-white p-4 shadow-sm" data-item="${i.id}"><div class="flex gap-3"><button type="button" data-act="done" class="mt-1 h-7 w-7 shrink-0 rounded-full border-2 border-emerald-700 ${i.got>=i.qty?'bg-emerald-700 text-white':''}">${i.got>=i.qty?'✓':''}</button><div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><div><h3 class="font-black ${i.got>=i.qty?'line-through opacity-50':''}">${esc(i.name)}</h3><p class="text-xs text-slate-500">${c[0]} ${c[1]} • ${esc(i.timing)}</p></div><button type="button" data-act="edit" class="rounded-lg px-2 text-xl">⋯</button></div><div class="mt-2 flex flex-wrap gap-2 text-xs"><span class="rounded-full bg-emerald-50 px-2 py-1">${i.status==='ordered'?'🚚 Commandé':i.status==='received'?'✓ Reçu':'🛒 À acheter'}</span><span class="rounded-full bg-slate-100 px-2 py-1">👤 ${esc(i.owner)}</span></div>${i.avoid?`<p class="mt-2 rounded-xl bg-amber-50 p-2 text-xs">⚠️ ${esc(i.avoid)}</p>`:''}<div class="mt-3 flex items-center justify-between"><div class="rounded-xl border"><button type="button" data-act="minus" class="px-3 py-2">−</button><b>${i.got} / ${i.qty}</b><button type="button" data-act="plus" class="px-3 py-2">＋</button></div><b>${eur(i.qty*i.unit)}</b></div></div></div></article>`}
function renderSearchResults(){const list=$('#purchaseList'),label=$('#resultCount');if(!list)return;const a=state.items.filter(i=>(!category||i.category===category)&&(!query||i.name.toLowerCase().includes(query.toLowerCase())));label.textContent=`${a.length} article${a.length>1?'s':''}`;list.innerHTML=a.map(itemCard).join('')||'<p class="rounded-2xl bg-white p-5 text-slate-500">Aucun article trouvé.</p>'}
function render(){const m=calc();$('#pct').textContent=m.pct+' %';$('#bar').style.width=m.pct+'%';$('#count').textContent=`${m.ready} unités prêtes • ${m.total-m.ready} restantes`;$('#message').textContent=m.urgent?`${m.urgent} indispensables à finaliser.`:'Tout est prêt.';$('#kpis').innerHTML=[['🚨',m.urgent,'Indispensables'],['🚚',m.ordered,'Commandés'],['€',eur(m.left),'Restant estimé'],['✓',m.ready+'/'+m.total,'Unités prêtes']].map(x=>`<div class="rounded-3xl bg-white p-4 shadow-sm"><div>${x[0]}</div><b class="text-xl">${x[1]}</b><p class="text-xs text-slate-500">${x[2]}</p></div>`).join('');const c=$('#content');if(view==='home'){const a=state.items.filter(i=>i.got<i.qty).sort((a,b)=>(b.priority==='essential')-(a.priority==='essential'));c.innerHTML=`<h2 class="text-2xl font-black">🎯 Notre priorité</h2><div class="mt-4 grid gap-3 md:grid-cols-2">${a.slice(0,8).map(itemCard).join('')}</div>`}else if(view==='buy'){c.innerHTML=`<h2 class="text-2xl font-black">🛒 Nos achats</h2><input id="searchInput" class="mt-4 w-full rounded-2xl bg-white p-3 shadow-sm" placeholder="🔍 Rechercher…" value="${esc(query)}"><div id="cats" class="mt-3 flex gap-2 overflow-auto"><button data-cat="" class="cat ${!category?'on':''} min-w-max rounded-full border px-3 py-2">Voir tout</button>${Object.entries(CATS).map(([v,x])=>`<button data-cat="${v}" class="cat ${category===v?'on':''} min-w-max rounded-full border px-3 py-2">${x[0]} ${x[1]}</button>`).join('')}</div><p id="resultCount" class="mt-4 text-sm text-slate-500"></p><div id="purchaseList" class="mt-3 grid gap-3 md:grid-cols-2"></div>`;renderSearchResults()}else if(view==='plan'){c.innerHTML=`<h2 class="text-2xl font-black">📅 Notre planning</h2>${TIMES.map(t=>`<section class="mt-6"><h3 class="font-black">${t}</h3><div class="mt-3 grid gap-3 md:grid-cols-2">${state.items.filter(i=>i.timing===t).map(itemCard).join('')}</div></section>`).join('')}`}else if(view==='budget'){c.innerHTML=`<h2 class="text-2xl font-black">€ Notre budget</h2><div class="mt-4 grid gap-3 md:grid-cols-3"><div class="rounded-3xl bg-white p-5">Prévisionnel<b class="block text-2xl">${eur(m.est)}</b></div><div class="rounded-3xl bg-white p-5">Dépensé<b class="block text-2xl">${eur(m.paid)}</b></div><div class="rounded-3xl bg-white p-5">Restant estimé<b class="block text-2xl">${eur(m.left)}</b></div></div>`}else{c.innerHTML=`<h2 class="text-2xl font-black">🏥 Notre valise et nos démarches</h2><div class="mt-4 grid gap-3 md:grid-cols-2">${state.items.filter(i=>i.category==='maternite').map(itemCard).join('')}</div>`}}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('on')}function hideModal(){$('#modal').classList.remove('on')}
function openItem(i=null){const x=i||{name:'',category:'vetements',timing:TIMES[0],qty:1,unit:0,got:0,paid:0,owner:'Papa',status:'buy',avoid:''};showModal(i?'Modifier l’article':'Ajouter un article',`<form id="itemForm" class="grid gap-3 sm:grid-cols-2"><label class="sm:col-span-2">Nom<input required name="name" value="${esc(x.name)}" class="w-full rounded-xl border p-2"></label><label>Catégorie<select name="category" class="w-full rounded-xl border p-2">${Object.entries(CATS).map(([v,c])=>`<option value="${v}" ${x.category===v?'selected':''}>${c[1]}</option>`).join('')}</select></label><label>Échéance<select name="timing" class="w-full rounded-xl border p-2">${TIMES.map(v=>`<option ${x.timing===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Quantité<input required name="qty" type="number" min="1" value="${x.qty}" class="w-full rounded-xl border p-2"></label><label>Prix unitaire (€)<input name="unit" type="number" min="0" step="0.01" value="${x.unit}" class="w-full rounded-xl border p-2"></label><label>Déjà obtenu<input name="got" type="number" min="0" value="${x.got}" class="w-full rounded-xl border p-2"></label><label>Payé (€)<input name="paid" type="number" min="0" step="0.01" value="${x.paid}" class="w-full rounded-xl border p-2"></label><label>Responsable<select name="owner" class="w-full rounded-xl border p-2">${OWNERS.map(v=>`<option ${x.owner===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Statut<select name="status" class="w-full rounded-xl border p-2"><option value="buy" ${x.status==='buy'?'selected':''}>À acheter</option><option value="ordered" ${x.status==='ordered'?'selected':''}>Commandé</option><option value="received" ${x.status==='received'?'selected':''}>Reçu</option></select></label><label class="sm:col-span-2">À éviter<input name="avoid" value="${esc(x.avoid)}" class="w-full rounded-xl border p-2"></label><div class="sm:col-span-2 flex justify-between"><button id="deleteItem" type="button" class="text-red-600">${i?'Supprimer':''}</button><button type="submit" class="rounded-xl bg-emerald-800 px-5 py-2 font-bold text-white">Enregistrer</button></div></form>`);const f=$('#itemForm');f.addEventListener('submit',e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));for(const k of ['qty','unit','got','paid'])o[k]=Number(o[k])||0;o.qty=Math.max(1,o.qty);o.got=Math.max(0,Math.min(o.qty,o.got));if(i){Object.assign(i,o)}else{Object.assign(o,{id:crypto.randomUUID?.()||'custom-'+Date.now(),priority:'normal'});state.items.unshift(o)}hideModal();persist()});if(i)$('#deleteItem').onclick=()=>{state.items=state.items.filter(y=>y.id!==i.id);hideModal();persist()}}
function settings(){showModal('Paramètres',`<label class="font-bold">Code famille partagé<input id="familyInput" value="${esc(family())}" placeholder="Au moins 10 caractères" class="mt-1 w-full rounded-xl border p-3"></label><p class="mt-2 text-xs text-slate-500">Utilisez exactement le même code privé sur les deux appareils.</p><button id="saveFamily" type="button" class="mt-4 w-full rounded-xl bg-emerald-800 p-3 font-bold text-white">Enregistrer et synchroniser</button><button id="exportData" type="button" class="mt-3 w-full rounded-xl border p-3">Exporter une sauvegarde JSON</button>`);$('#saveFamily').onclick=()=>{localStorage.setItem(FKEY,$('#familyInput').value.trim());hideModal();pullCloud()};$('#exportData').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='adel-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));view=b.dataset.v;render()});
$('#content').addEventListener('input',e=>{if(e.target.id==='searchInput'){query=e.target.value;renderSearchResults()}});
$('#content').addEventListener('click',e=>{const cb=e.target.closest('[data-cat]');if(cb){category=cb.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===cb));renderSearchResults();return}const card=e.target.closest('[data-item]');if(!card)return;const i=state.items.find(x=>x.id===card.dataset.item);const act=e.target.closest('[data-act]')?.dataset.act;if(!i||!act)return;if(act==='plus')i.got=Math.min(i.qty,i.got+1);if(act==='minus')i.got=Math.max(0,i.got-1);if(act==='done')i.got=i.got>=i.qty?0:i.qty;if(act==='edit')return openItem(i);persist()});
$('#addBtn').onclick=()=>openItem();$('#closeModal').onclick=hideModal;$('#modal').onclick=e=>{if(e.target.id==='modal')hideModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});$('#syncBtn').onclick=()=>family()?pullCloud():settings();
render();pullCloud();setInterval(pullCloud,10000);if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
