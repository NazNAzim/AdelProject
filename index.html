<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#587563"><title>Notre préparation pour Adel</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f4f7f4;color:#34443b}.tab.on,.chip.on{background:#587563;color:#fff}.modal{display:none}.modal.on{display:flex}</style></head><body class="min-h-screen pb-24">
<header class="bg-gradient-to-br from-emerald-900 to-emerald-700 p-6 text-white"><div class="mx-auto max-w-6xl"><div class="flex justify-between"><div><p class="text-xs font-bold uppercase tracking-widest">Notre préparation</p><h1 class="text-4xl font-black">🧸 Adel</h1><p id="message" class="mt-2"></p><button id="sync" class="mt-3 rounded-full bg-white/15 px-3 py-1 text-xs font-bold">☁️ Mode local</button></div><button id="settings" class="h-12 rounded-2xl bg-white/15 px-4">⚙️</button></div><div class="mt-6 flex justify-between"><b id="pct" class="text-3xl">0 %</b><span id="count"></span></div><div class="mt-2 h-3 rounded-full bg-white/20"><div id="bar" class="h-3 rounded-full bg-amber-300" style="width:0"></div></div></div></header>
<main class="mx-auto max-w-6xl p-4"><section id="kpis" class="grid grid-cols-2 gap-3 py-5 md:grid-cols-4"></section><nav class="sticky top-2 z-20 flex gap-1 overflow-auto rounded-2xl bg-white/90 p-1 shadow"><button class="tab on rounded-xl px-4 py-3 font-bold" data-view="home">🏠 Accueil</button><button class="tab rounded-xl px-4 py-3 font-bold" data-view="buy">🛒 Achats</button><button class="tab rounded-xl px-4 py-3 font-bold" data-view="plan">📅 Planning</button><button class="tab rounded-xl px-4 py-3 font-bold" data-view="budget">€ Budget</button><button class="tab rounded-xl px-4 py-3 font-bold" data-view="maternity">🏥 Maternité</button></nav><section id="content" class="py-6"></section></main>
<button id="add" class="fixed bottom-5 right-5 h-14 w-14 rounded-full bg-emerald-800 text-3xl text-white shadow-xl">＋</button><div id="modal" class="modal fixed inset-0 z-50 items-end justify-center bg-black/40 sm:items-center"><div class="max-h-[94vh] w-full max-w-2xl overflow-auto rounded-t-3xl bg-white p-6 sm:rounded-3xl"><div class="flex justify-between"><h2 id="mtitle" class="text-2xl font-black"></h2><button id="close">✕</button></div><div id="mbody" class="mt-5"></div></div></div>
<script>
const KEY='adel_v5',FKEY='adel_family',CATS={vetements:['👕','Vêtements'],sommeil:['🌙','Sommeil'],soins:['🛁','Soins'],sorties:['🚗','Sorties'],eveil:['🧸','Éveil & repas'],maternite:['🧳','Maternité & démarches']},TIMES=['À préparer maintenant','Avant le 15 décembre','Avant le 25 décembre','Valise maternité','Jour J • 1er janvier','Retour à la maison','1er mois','2 à 3 mois','Plus tard'],OWNERS=['Papa','Maman','Mamie Béa','Mamie Lydia','Papi Xav','Autre'];
const rows=[['Bodies manches longues naissance/1 mois','vetements','Avant le 25 décembre',8,8],['Pyjamas chauds naissance/1 mois','vetements','Avant le 25 décembre',8,12],['Gilets/brassières chaudes','vetements','Avant le 25 décembre',3,18],['Bonnets naissance','vetements','Valise maternité',2,8],['Chaussettes/chaussons','vetements','Avant le 25 décembre',4,5],['Tenues 3 mois','vetements','1er mois',5,20],['Lit ou berceau conforme','sommeil','Avant le 15 décembre',1,150],['Matelas ferme adapté','sommeil','Avant le 15 décembre',1,70],['Draps-housses','sommeil','Avant le 25 décembre',3,15],['Alèses respirantes','sommeil','Avant le 25 décembre',2,15],['Gigoteuses hiver adaptées','sommeil','Avant le 25 décembre',2,35],['Couches taille naissance/1','soins','Avant le 25 décembre',3,12],['Carrés de coton ou lingettes lavables','soins','Avant le 25 décembre',2,10],['Produit de change','soins','Avant le 25 décembre',1,8],['Thermomètre électronique','soins','Avant le 25 décembre',1,15],['Sérum physiologique unidose','soins','Avant le 25 décembre',2,5],['Cape de bain','soins','Retour à la maison',2,15],['Matelas à langer sécurisé','soins','Avant le 25 décembre',1,70],['Coque/cosy R129 dès la naissance','sorties','Avant le 15 décembre',1,220],['Installer et tester le siège auto','sorties','Avant le 25 décembre',1,0],['Poussette nouveau-né','sorties','Avant le 25 décembre',1,450],['Chancelière/couverture de sortie','sorties','Avant le 25 décembre',1,60],['Sac à langer','sorties','Valise maternité',1,60],['Tapis d’éveil ferme','eveil','1er mois',1,45],['Biberons naissance si besoin','eveil','Retour à la maison',4,10],['Goupillon','eveil','Retour à la maison',1,8],['Bavoirs','eveil','Retour à la maison',6,5],['Dossier maternité et identités','maternite','Valise maternité',1,0],['Tenue de naissance complète','maternite','Valise maternité',1,25],['Pyjamas/bodies pour le séjour','maternite','Valise maternité',5,12],['Gigoteuse maternité','maternite','Valise maternité',1,35],['Affaires confortables Maman','maternite','Valise maternité',1,90],['Nécessaire toilette Maman','maternite','Valise maternité',1,30],['Chargeurs et encas parents','maternite','Valise maternité',1,20],['Déclaration de naissance','maternite','Jour J • 1er janvier',1,0],['Déclaration Assurance Maladie','maternite','Retour à la maison',1,0],['Déclaration CAF/MSA','maternite','Retour à la maison',1,0],['Prévenir les mutuelles','maternite','Retour à la maison',1,0],['Organiser le suivi postnatal','maternite','Retour à la maison',1,0]];
const defaults=()=>({version:5,updatedAt:'',budget:1800,items:rows.map((r,n)=>({id:'i'+n,name:r[0],category:r[1],timing:r[2],qty:r[3],unit:r[4],got:0,paid:0,priority:['Plus tard','1er mois','2 à 3 mois'].includes(r[2])?'normal':'essential',status:'buy',acq:'new',owner:'Papa',notes:'',avoid:r[0].startsWith('Lit')?'Sans oreiller, couette, tour de lit, cale-bébé ni objet mou. Couchage sur le dos.':r[0].startsWith('Coque')?'Modèle R129 adapté dès la naissance, installé dos à la route et compatible avec la voiture.':''}))});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}let view='home',cat='',q='',saving=false,timer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0),fam=()=>localStorage.getItem(FKEY)||'';
function metrics(){let total=0,ready=0,est=0,paid=0;state.items.forEach(i=>{total+=i.qty;ready+=Math.min(i.qty,i.got);est+=i.qty*i.unit;paid+=i.paid});return{total,ready,pct:total?Math.round(ready/total*100):0,est,paid,left:state.items.reduce((s,i)=>s+Math.max(0,i.qty-i.got)*i.unit,0),urgent:state.items.filter(i=>i.priority==='essential'&&i.got<i.qty).length,ordered:state.items.filter(i=>i.status==='ordered').length}}
function save(){state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));render();if(fam()&&!saving){clearTimeout(timer);timer=setTimeout(push,300)}}async function push(){try{sync.textContent='☁️ Synchronisation…';let r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(fam()),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw 0;sync.textContent='☁️ Partagé • à jour'}catch{sync.textContent='⚠️ Hors connexion • local'}}async function pull(){if(!fam())return sync.textContent='☁️ Mode local';try{sync.textContent='☁️ Chargement partagé…';let r=await fetch('/.netlify/functions/family-data?household='+encodeURIComponent(fam()),{cache:'no-store'});if(r.status===404)return push();if(!r.ok)throw 0;let d=await r.json();if(d.updatedAt>state.updatedAt){saving=true;state=d;localStorage.setItem(KEY,JSON.stringify(state));render();saving=false}sync.textContent='☁️ Partagé • à jour'}catch{sync.textContent='⚠️ Hors connexion • local'}}
function card(i){let c=CATS[i.category];return `<article class="rounded-3xl bg-white p-4 shadow-sm" data-id="${i.id}"><div class="flex gap-3"><button class="done mt-1 h-7 w-7 shrink-0 rounded-full border-2 border-emerald-700 ${i.got>=i.qty?'bg-emerald-700 text-white':''}">${i.got>=i.qty?'✓':''}</button><div class="min-w-0 flex-1"><div class="flex justify-between"><div><h3 class="font-black ${i.got>=i.qty?'line-through opacity-50':''}">${esc(i.name)}</h3><p class="text-xs text-slate-500">${c[0]} ${c[1]} • ${esc(i.timing)}</p></div><button class="edit text-xl">⋯</button></div><div class="mt-2 flex flex-wrap gap-2 text-xs"><span class="rounded-full bg-emerald-50 px-2 py-1">${i.status==='ordered'?'🚚 Commandé':i.status==='received'?'✓ Reçu':'🛒 À acheter'}</span><span class="rounded-full bg-slate-100 px-2 py-1">👤 ${esc(i.owner)}</span></div>${i.avoid?`<p class="mt-2 rounded-xl bg-amber-50 p-2 text-xs">⚠️ ${esc(i.avoid)}</p>`:''}<div class="mt-3 flex items-center justify-between"><div class="rounded-xl border"><button class="minus px-3 py-2">−</button><b>${i.got} / ${i.qty}</b><button class="plus px-3 py-2">＋</button></div><b>${money(i.qty*i.unit)}</b></div></div></div></article>`}
function render(){let m=metrics();pct.textContent=m.pct+' %';bar.style.width=m.pct+'%';count.textContent=`${m.ready} unités prêtes • ${m.total-m.ready} restantes`;message.textContent=m.urgent?`${m.urgent} indispensables à finaliser.`:'Tout est prêt.';kpis.innerHTML=[['🚨',m.urgent,'Indispensables'],['🚚',m.ordered,'Commandés'],['€',money(m.left),'Restant estimé'],['✓',m.ready+'/'+m.total,'Unités prêtes']].map(x=>`<div class="rounded-3xl bg-white p-4 shadow-sm"><div>${x[0]}</div><b class="text-xl">${x[1]}</b><p class="text-xs text-slate-500">${x[2]}</p></div>`).join('');if(view==='home'){let a=state.items.filter(i=>i.got<i.qty).sort((a,b)=>(b.priority==='essential')-(a.priority==='essential'));content.innerHTML=`<h2 class="text-2xl font-black">🎯 Notre priorité</h2><div class="mt-4 grid gap-3 md:grid-cols-2">${a.slice(0,8).map(card).join('')}</div>`}if(view==='buy'){let a=state.items.filter(i=>(!cat||i.category===cat)&&(!q||i.name.toLowerCase().includes(q.toLowerCase())));content.innerHTML=`<h2 class="text-2xl font-black">🛒 Nos achats</h2><input class="mt-4 w-full rounded-2xl bg-white p-3" placeholder="🔍 Rechercher…" value="${esc(q)}" oninput="q=this.value;render()"><div class="mt-3 flex gap-2 overflow-auto"><button class="chip ${!cat?'on':''} min-w-max rounded-full border px-3 py-2" onclick="cat='';render()">Voir tout</button>${Object.entries(CATS).map(([v,c])=>`<button class="chip ${cat===v?'on':''} min-w-max rounded-full border px-3 py-2" onclick="cat='${v}';render()">${c[0]} ${c[1]}</button>`).join('')}</div><div class="mt-4 grid gap-3 md:grid-cols-2">${a.map(card).join('')}</div>`}if(view==='plan')content.innerHTML=`<h2 class="text-2xl font-black">📅 Notre planning</h2>${TIMES.map(t=>`<section class="mt-6"><h3 class="font-black">${t}</h3><div class="mt-3 grid gap-3 md:grid-cols-2">${state.items.filter(i=>i.timing===t).map(card).join('')}</div></section>`).join('')}`;if(view==='budget')content.innerHTML=`<h2 class="text-2xl font-black">€ Notre budget</h2><div class="mt-4 grid gap-3 md:grid-cols-3"><div class="rounded-3xl bg-white p-5">Prévisionnel<b class="block text-2xl">${money(m.est)}</b></div><div class="rounded-3xl bg-white p-5">Dépensé<b class="block text-2xl">${money(m.paid)}</b></div><div class="rounded-3xl bg-white p-5">Restant estimé<b class="block text-2xl">${money(m.left)}</b></div></div>`;if(view==='maternity')content.innerHTML=`<h2 class="text-2xl font-black">🏥 Notre valise et nos démarches</h2><div class="mt-4 grid gap-3 md:grid-cols-2">${state.items.filter(i=>i.category==='maternite').map(card).join('')}</div><p class="mt-6 rounded-2xl bg-white p-4 text-xs text-slate-500">Liste initiale fondée sur les repères de l’Assurance Maladie, 1000 premiers jours, Service-Public.fr et Sécurange. La liste de votre maternité reste prioritaire.</p>`;bind()}
function bind(){document.querySelectorAll('[data-id]').forEach(e=>{let i=state.items.find(x=>x.id===e.dataset.id);e.querySelector('.plus').onclick=()=>{i.got=Math.min(i.qty,i.got+1);save()};e.querySelector('.minus').onclick=()=>{i.got=Math.max(0,i.got-1);save()};e.querySelector('.done').onclick=()=>{i.got=i.got>=i.qty?0:i.qty;save()};e.querySelector('.edit').onclick=()=>form(i)})}
function show(title,html){mtitle.textContent=title;mbody.innerHTML=html;modal.classList.add('on')}function hide(){modal.classList.remove('on')}
function form(i={}){show(i.id?'Modifier l’article':'Ajouter un article',`<form id="form" class="grid gap-3 sm:grid-cols-2"><input type="hidden" name="id" value="${i.id||''}"><label class="sm:col-span-2">Nom<input required name="name" value="${esc(i.name||'')}" class="w-full rounded-xl border p-2"></label><label>Catégorie<select name="category" class="w-full rounded-xl border p-2">${Object.entries(CATS).map(([v,c])=>`<option value="${v}" ${i.category===v?'selected':''}>${c[1]}</option>`).join('')}</select></label><label>Échéance<select name="timing" class="w-full rounded-xl border p-2">${TIMES.map(v=>`<option ${i.timing===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Quantité<input name="qty" type="number" min="1" value="${i.qty||1}" class="w-full rounded-xl border p-2"></label><label>Prix unitaire<input name="unit" type="number" min="0" value="${i.unit||0}" class="w-full rounded-xl border p-2"></label><label>Obtenu<input name="got" type="number" min="0" value="${i.got||0}" class="w-full rounded-xl border p-2"></label><label>Payé total<input name="paid" type="number" min="0" value="${i.paid||0}" class="w-full rounded-xl border p-2"></label><label>Responsable<select name="owner" class="w-full rounded-xl border p-2">${OWNERS.map(v=>`<option ${i.owner===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Statut<select name="status" class="w-full rounded-xl border p-2"><option value="buy">À acheter</option><option value="ordered" ${i.status==='ordered'?'selected':''}>Commandé</option><option value="received" ${i.status==='received'?'selected':''}>Reçu</option></select></label><label class="sm:col-span-2">À éviter<input name="avoid" value="${esc(i.avoid||'')}" class="w-full rounded-xl border p-2"></label><div class="sm:col-span-2 flex justify-between"><button type="button" id="del" class="text-red-600">${i.id?'Supprimer':''}</button><button class="rounded-xl bg-emerald-800 px-5 py-2 text-white">Enregistrer</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));['qty','unit','got','paid'].forEach(k=>o[k]=Number(o[k])||0);o.priority=i.priority||'normal';o.acq=i.acq||'new';if(i.id)Object.assign(i,o);else{o.id=crypto.randomUUID();state.items.unshift(o)}hide();save()};if(i.id)del.onclick=()=>{state.items=state.items.filter(x=>x.id!==i.id);hide();save()}}
function settingsForm(){show('Paramètres',`<label>Code famille partagé<input id="fcode" value="${esc(fam())}" placeholder="Au moins 10 caractères" class="w-full rounded-xl border p-3"></label><p class="mt-2 text-xs text-slate-500">Utilisez exactement le même code privé sur les deux appareils.</p><button id="savenow" class="mt-4 w-full rounded-xl bg-emerald-800 p-3 text-white">Enregistrer et synchroniser</button><button id="exportBtn" class="mt-3 w-full rounded-xl border p-3">Exporter une sauvegarde JSON</button>`);savenow.onclick=()=>{localStorage.setItem(FKEY,fcode.value.trim());hide();pull()};exportBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='adel-sauvegarde.json';a.click()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.view;render()});add.onclick=()=>form({category:'vetements',timing:TIMES[0],owner:'Papa',status:'buy'});settings.onclick=settingsForm;sync.onclick=pull;close.onclick=hide;modal.onclick=e=>{if(e.target===modal)hide()};render();pull();setInterval(pull,10000);
</script></body></html>
