<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#355d49">

    <meta
        name="description"
        content="Liste familiale partagée pour préparer l'arrivée d'Adel."
    >

    <link rel="manifest" href="manifest.webmanifest">

    <title>Notre préparation pour Adel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            color-scheme: light;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: #304138;
            background:
                linear-gradient(
                    180deg,
                    #f4f7f4 0%,
                    #fffaf4 48%,
                    #ffffff 100%
                );
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            touch-action: manipulation;
        }

        .main-tab.is-active,
        .category-button.is-active,
        .filter-button.is-active {
            color: #ffffff;
            background: #416d57;
            border-color: #416d57;
        }

        .modal {
            display: none;
        }

        .modal.is-open {
            display: flex;
        }

        .modal-panel {
            color: #1f2937;
            background: #ffffff;
        }

        .modal-panel label {
            display: block;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 700;
        }

        .modal-panel input,
        .modal-panel select,
        .modal-panel textarea {
            display: block;
            width: 100%;
            margin-top: 0.375rem;
            padding: 0.75rem;
            color: #111827;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            caret-color: #111827;
        }

        .modal-panel input::placeholder,
        .modal-panel textarea::placeholder {
            color: #94a3b8;
        }

        .modal-panel input:focus,
        .modal-panel select:focus,
        .modal-panel textarea:focus {
            border-color: #d97706;
            outline: 3px solid rgba(245, 158, 11, 0.25);
        }

        .modal-panel option {
            color: #111827;
            background: #ffffff;
        }

        .focus-visible:focus-visible {
            outline: 3px solid #fbbf24;
            outline-offset: 3px;
        }

        .toast-enter {
            animation: toast-enter 200ms ease-out;
        }

        @keyframes toast-enter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                color: #000000;
                background: #ffffff;
            }

            article {
                break-inside: avoid;
            }
        }
    </style>
</head>

<body class="pb-12">

    <!-- Bandeau principal -->
    <header
        class="bg-gradient-to-br from-emerald-950 via-emerald-900 to-emerald-700 px-4 py-6 text-white"
    >
        <div class="mx-auto max-w-6xl">

            <div class="flex items-start justify-between gap-4">

                <div class="min-w-0">
                    <p
                        class="text-xs font-bold uppercase tracking-[0.2em] text-emerald-100"
                    >
                        Notre préparation
                    </p>

                    <h1 class="mt-1 text-3xl font-black sm:text-4xl">
                        🧸 Adel
                    </h1>

                    <p
                        id="headerMessage"
                        class="mt-2 text-sm text-emerald-100"
                    ></p>

                    <button
                        id="syncButton"
                        type="button"
                        class="focus-visible mt-3 rounded-full bg-white/15 px-3 py-1.5 text-xs font-bold transition hover:bg-white/25"
                    >
                        ☁️ Mode local
                    </button>
                </div>

                <div class="flex shrink-0 items-center gap-2">

                    <button
                        id="settingsButton"
                        type="button"
                        aria-label="Ouvrir les paramètres"
                        title="Paramètres"
                        class="focus-visible grid h-11 w-11 place-items-center rounded-xl bg-white/15 text-xl transition hover:bg-white/25"
                    >
                        ⚙️
                    </button>

                    <button
                        id="addButton"
                        type="button"
                        class="focus-visible flex h-11 items-center gap-2 rounded-xl bg-white px-3 font-black text-emerald-900 shadow-lg transition hover:bg-emerald-50 sm:px-4"
                    >
                        <span class="text-xl leading-none">＋</span>
                        <span class="hidden sm:inline">Ajouter</span>
                    </button>

                </div>
            </div>

            <!-- Progression -->
            <div class="mt-6">

                <div class="flex items-end justify-between gap-4">

                    <div>
                        <strong
                            id="progressPercent"
                            class="text-3xl font-black"
                        >
                            0 %
                        </strong>

                        <span class="ml-1 text-sm text-emerald-100">
                            prêt
                        </span>
                    </div>

                    <span
                        id="progressCount"
                        class="max-w-[60%] text-right text-xs text-emerald-100 sm:text-sm"
                    ></span>

                </div>

                <div
                    class="mt-2 h-3 w-full overflow-hidden rounded-full bg-white/20"
                >
                    <div
                        id="progressBar"
                        class="h-full rounded-full bg-amber-300 transition-all duration-300"
                        style="width: 0%"
                    ></div>
                </div>

            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="mx-auto max-w-6xl px-4 py-5">

        <!-- Indicateurs -->
        <section
            id="kpiContainer"
            class="grid grid-cols-2 gap-3 md:grid-cols-4"
            aria-label="Indicateurs"
        ></section>

        <!-- Navigation -->
        <nav
            id="mainNavigation"
            class="no-print sticky top-2 z-30 mt-5 flex gap-1 overflow-x-auto rounded-2xl border border-emerald-100 bg-white/95 p-1 shadow-lg backdrop-blur"
            aria-label="Navigation principale"
        >
            <button
                type="button"
                data-view="home"
                class="main-tab is-active focus-visible min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold"
            >
                🏠 Accueil
            </button>

            <button
                type="button"
                data-view="purchases"
                class="main-tab focus-visible min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold"
            >
                🛒 Achats
            </button>

            <button
                type="button"
                data-view="planning"
                class="main-tab focus-visible min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold"
            >
                📅 Planning
            </button>

            <button
                type="button"
                data-view="budget"
                class="main-tab focus-visible min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold"
            >
                € Budget
            </button>

            <button
                type="button"
                data-view="maternity"
                class="main-tab focus-visible min-w-max flex-1 rounded-xl px-4 py-3 text-sm font-bold"
            >
                🏥 Maternité
            </button>
        </nav>

        <!-- Vue dynamique -->
        <section id="mainContent" class="py-6"></section>

    </main>

    <!-- Notifications -->
    <div
        id="toastContainer"
        class="pointer-events-none fixed bottom-6 left-1/2 z-[70] w-[min(92vw,420px)] -translate-x-1/2 space-y-2"
        aria-live="polite"
    ></div>

    <!-- Fenêtre modale -->
    <div
        id="modal"
        class="modal fixed inset-0 z-50 items-end justify-center bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >
        <div
            class="modal-panel max-h-[94vh] w-full max-w-2xl overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl sm:rounded-3xl sm:p-7"
        >
            <div
                class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white pb-4"
            >
                <h2
                    id="modalTitle"
                    class="text-2xl font-black text-slate-900"
                ></h2>

                <button
                    id="closeModalButton"
                    type="button"
                    aria-label="Fermer la fenêtre"
                    title="Fermer"
                    class="focus-visible grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-xl font-black text-slate-700 transition hover:bg-slate-200"
                >
                    ✕
                </button>
            </div>

            <div id="modalBody" class="mt-5"></div>
        </div>
    </div>

    <script>
        'use strict';

        /*
         * Configuration générale
         */

        const APP_VERSION = 6;
        const LOCAL_STORAGE_KEY = 'adel_v6';
        const FAMILY_CODE_KEY = 'adel_family';

        const CATEGORIES = {

                icon: '👕',
                label: 'Vêtements'
            },
            sommeil: {
                icon: '🌙',
                label: 'Sommeil'
            },
            soins: {
                icon: '🛁',
                label: 'Soins'
            },
            sorties: {
                icon: '🚗',
                label: 'Sorties'
            },
            eveil: {
                icon: '🧸',
                label: 'Éveil & repas'
            },
            maternite: {
                icon: '🧳',
                label: 'Maternité & démarches'
            }
        };

        const TIMINGS = [
            'À préparer maintenant',
            'Avant le 15 décembre',
            'Avant le 25 décembre',
            'Valise maternité',
            'Jour J • 1er janvier',
            'Retour à la maison',
            '1er mois',
            '2 à 3 mois',
            'Plus tard'
        ];

        const OWNERS = [
            'Papa',
            'Maman',
            'Mamie Béa',
            'Mamie Lydia',
            'Papi Xav',
            'Autre'
        ];

        const STATUS_LABELS = {
            buy: 'À acheter',
            ordered: 'Commandé',
            received: 'Reçu'
        };

        const STATUS_ICONS = {
            buy: '🛒',
            ordered: '🚚',
            received: '✓'
        };

        /*
         * Liste initiale
         */

        const INITIAL_ROWS = [
            ['Bodies manches longues naissance/1 mois', 'vetements', 'Avant le 25 décembre', 8, 8],
            ['Pyjamas chauds naissance/1 mois', 'vetements', 'Avant le 25 décembre', 8, 12],
            ['Gilets ou brassières chaudes', 'vetements', 'Avant le 25 décembre', 3, 18],
            ['Bonnets naissance', 'vetements', 'Valise maternité', 2, 8],
            ['Chaussettes ou chaussons', 'vetements', 'Avant le 25 décembre', 4, 5],
            ['Tenues 3 mois', 'vetements', '1er mois', 5, 20],

            ['Lit ou berceau conforme', 'sommeil', 'Avant le 15 décembre', 1, 150],
            ['Matelas ferme adapté', 'sommeil', 'Avant le 15 décembre', 1, 70],
            ['Draps-housses adaptés', 'sommeil', 'Avant le 25 décembre', 3, 15],
            ['Alèses respirantes', 'sommeil', 'Avant le 25 décembre', 2, 15],
            ['Gigoteuses hiver adaptées', 'sommeil', 'Avant le 25 décembre', 2, 35],

            ['Couches taille naissance/1', 'soins', 'Avant le 25 décembre', 3, 12],
            ['Carrés de coton ou lingettes lavables', 'soins', 'Avant le 25 décembre', 2, 10],
            ['Produit de change', 'soins', 'Avant le 25 décembre', 1, 8],
            ['Thermomètre électronique', 'soins', 'Avant le 25 décembre', 1, 15],
            ['Sérum physiologique unidose', 'soins', 'Avant le 25 décembre', 2, 5],
            ['Cape de bain', 'soins', 'Retour à la maison', 2, 15],
            ['Matelas à langer sécurisé', 'soins', 'Avant le 25 décembre', 1, 70],

            ['Coque/cosy R129 dès la naissance', 'sorties', 'Avant le 15 décembre', 1, 220],
            ['Installer et tester le siège auto', 'sorties', 'Avant le 25 décembre', 1, 0],
            ['Poussette compatible nouveau-né', 'sorties', 'Avant le 25 décembre', 1, 450],
            ['Chancelière ou couverture de sortie', 'sorties', 'Avant le 25 décembre', 1, 60],
            ['Sac à langer', 'sorties', 'Valise maternité', 1, 60],

            ['Tapis d’éveil ferme', 'eveil', '1er mois', 1, 45],
            ['Biberons naissance si besoin', 'eveil', 'Retour à la maison', 4, 10],
            ['Goupillon', 'eveil', 'Retour à la maison', 1, 8],
            ['Bavoirs', 'eveil', 'Retour à la maison', 6, 5],

            ['Dossier maternité et pièces d’identité', 'maternite', 'Valise maternité', 1, 0],
            ['Tenue de naissance complète', 'maternite', 'Valise maternité', 1, 25],
            ['Pyjamas et bodies pour le séjour', 'maternite', 'Valise maternité', 5, 12],
            ['Gigoteuse maternité', 'maternite', 'Valise maternité', 1, 35],
            ['Affaires confortables Maman', 'maternite', 'Valise maternité', 1, 90],
            ['Nécessaire de toilette Maman', 'maternite', 'Valise maternité', 1, 30],
            ['Chargeurs et encas parents', 'maternite', 'Valise maternité', 1, 20],
            ['Déclaration de naissance', 'maternite', 'Jour J • 1er janvier', 1, 0],
            ['Déclaration Assurance Maladie', 'maternite', 'Retour à la maison', 1, 0],
            ['Déclaration CAF/MSA', 'maternite', 'Retour à la maison', 1, 0],
            ['Prévenir les mutuelles', 'maternite', 'Retour à la maison', 1, 0],
            ['Organiser le suivi postnatal', 'maternite', 'Retour à la maison', 1, 0]
        ];

        /*
         * État de l'application
         */

        let state = loadLocalState();
        let currentView = 'home';
        let activeCategory = '';
        let searchQuery = '';
        let activeStatus = '';
        let synchronizationInProgress = false;
        let synchronizationTimer = null;
        let lastFocusedElement = null;

        /*
         * Utilitaires
         */

        function element(selector) {
            return document.querySelector(selector);
        }

        function elements(selector) {
            return document.querySelectorAll(selector);
        }

        function createInitialState() {
            return {
                version: APP_VERSION,
                updatedAt: '',
                items: INITIAL_ROWS.map((row, index) => {
                    const [
                        name,
                        category,
                        timing,
                        quantity,
                        unitPrice
                    ] = row;

                    let avoid = '';

                    if (name.startsWith('Lit ou berceau')) {
                        avoid =
                            'Sans oreiller, couette, tour de lit, cale-bébé ni objet mou. Couchage sur le dos.';
                    }

                    if (name.startsWith('Coque/cosy')) {
                        avoid =
                            'Modèle R129 adapté dès la naissance, dos à la route et compatible avec la voiture.';
                    }

                    return {
                        id: `base-${index}`,
                        name,
                        category,
                        timing,
                        qty: quantity,
                        unit: unitPrice,
                        got: 0,
                        paid: 0,
                        priority: [
                            '1er mois',
                            '2 à 3 mois',
                            'Plus tard'
                        ].includes(timing)
                            ? 'normal'
                            : 'essential',
                        status: 'buy',
                        owner: 'Papa',
                        notes: '',
                        avoid
                    };
                })
            };
        }

        function loadLocalState() {
            try {
                const storedValue =
                    localStorage.getItem(LOCAL_STORAGE_KEY);

                if (!storedValue) {
                    return createInitialState();
                }

                const parsedValue = JSON.parse(storedValue);

                if (!parsedValue || !Array.isArray(parsedValue.items)) {
                    return createInitialState();
                }

                return parsedValue;
            } catch (error) {
                console.error(
                    'Impossible de charger les données locales.',
                    error
                );

                return createInitialState();
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(
                /[&<>"']/g,
                character => {
                    const entities = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };

                    return entities[character];
                }
            );
        }

        function formatMoney(value) {
            return new Intl.NumberFormat(
                'fr-FR',
                {
                    style: 'currency',
                    currency: 'EUR'
                }
            ).format(Number(value) || 0);
        }

        function getFamilyCode() {
            return localStorage.getItem(FAMILY_CODE_KEY) || '';
        }

        function createId() {
            if (
                window.crypto &&
                typeof window.crypto.randomUUID === 'function'
            ) {
                return window.crypto.randomUUID();
            }

            return `custom-${Date.now()}-${Math.random()
                .toString(16)
                .slice(2)}`;
        }

        function getItemById(itemId) {
            return state.items.find(item => item.id === itemId);
        }

        function showToast(message) {
            const toast = document.createElement('div');

            toast.className =
                'toast-enter pointer-events-auto rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold text-white shadow-2xl';

            toast.textContent = message;

            element('#toastContainer').appendChild(toast);

            window.setTimeout(() => {
                toast.remove();
            }, 3500);
        }

        /*
         * Calculs
         */

        function calculateMetrics() {
            let totalQuantity = 0;
            let readyQuantity = 0;
            let estimatedBudget = 0;
            let actualBudget = 0;

            state.items.forEach(item => {
                const quantity = Math.max(
                    1,
                    Number(item.qty) || 1
                );

                const acquired = Math.min(
                    quantity,
                    Math.max(0, Number(item.got) || 0)
                );

                totalQuantity += quantity;
                readyQuantity += acquired;
                estimatedBudget +=
                    quantity * (Number(item.unit) || 0);
                actualBudget += Number(item.paid) || 0;
            });

            const remainingBudget = state.items.reduce(
                (total, item) => {
                    const quantity = Math.max(
                        1,
                        Number(item.qty) || 1
                    );

                    const acquired = Math.min(
                        quantity,
                        Math.max(0, Number(item.got) || 0)
                    );

                    const remainingQuantity =
                        quantity - acquired;

                    return (
                        total +
                        remainingQuantity *
                            (Number(item.unit) || 0)
                    );
                },
                0
            );

            const urgentCount = state.items.filter(item => {
                return (
                    item.priority === 'essential' &&
                    Number(item.got) < Number(item.qty)
                );
            }).length;

            const orderedCount = state.items.filter(
                item => item.status === 'ordered'
            ).length;

            return {
                totalQuantity,
                readyQuantity,
                remainingQuantity:
                    totalQuantity - readyQuantity,
                percent:
                    totalQuantity > 0
                        ? Math.round(
                            readyQuantity /
                            totalQuantity *
                            100
                        )
                        : 0,
                estimatedBudget,
                actualBudget,
                remainingBudget,
                urgentCount,
                orderedCount
            };
        }

        /*
         * Sauvegarde et synchronisation
         */

        function persistState() {
            state.updatedAt = new Date().toISOString();

            localStorage.setItem(
                LOCAL_STORAGE_KEY,
                JSON.stringify(state)
            );

            renderApplication();

            if (
                getFamilyCode() &&
                !synchronizationInProgress
            ) {
                window.clearTimeout(synchronizationTimer);

                synchronizationTimer = window.setTimeout(
                    pushCloudState,
                    300
                );
            }
        }

        async function pushCloudState() {
            const familyCode = getFamilyCode();

            if (!familyCode) {
                setSyncStatus('☁️ Mode local');
                return;
            }

            try {
                setSyncStatus('☁️ Synchronisation…');

                const response = await fetch(
                    '/.netlify/functions/family-data' +
                    `?household=${encodeURIComponent(familyCode)}`,
                    {
                        method: 'PUT',
                        headers: {
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify(state)
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                const savedState = await response.json();

                if (savedState.updatedAt) {
                    state.updatedAt = savedState.updatedAt;

                    localStorage.setItem(
                        LOCAL_STORAGE_KEY,
                        JSON.stringify(state)
                    );
                }

                setSyncStatus('☁️ Partagé • à jour');
            } catch (error) {
                console.error(
                    'Erreur pendant la synchronisation.',
                    error
                );

                setSyncStatus(
                    '⚠️ Hors connexion • local'
                );
            }
        }

        async function pullCloudState(showLoading = true) {
            const familyCode = getFamilyCode();

            if (!familyCode) {
                setSyncStatus('☁️ Mode local');
                return;
            }

            try {
                if (showLoading) {
                    setSyncStatus(
                        '☁️ Chargement partagé…'
                    );
                }

                const response = await fetch(
                    '/.netlify/functions/family-data' +
                    `?household=${encodeURIComponent(familyCode)}`,
                    {
                        cache: 'no-store'
                    }
                );

                if (response.status === 404) {
                    await pushCloudState();
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                const cloudState = await response.json();

                const cloudDate = cloudState.updatedAt || '';
                const localDate = state.updatedAt || '';

                if (
                    cloudState &&
                    Array.isArray(cloudState.items) &&
                    cloudDate > localDate
                ) {
                    synchronizationInProgress = true;
                    state = cloudState;

                    localStorage.setItem(
                        LOCAL_STORAGE_KEY,
                        JSON.stringify(state)
                    );

                    renderApplication();
                    synchronizationInProgress = false;
                }

                setSyncStatus('☁️ Partagé • à jour');
            } catch (error) {
                console.error(
                    'Impossible de récupérer les données partagées.',
                    error
                );

                setSyncStatus(
                    '⚠️ Hors connexion • local'
                );
            }
        }

        function setSyncStatus(message) {
            const button = element('#syncButton');

            if (button) {
                button.textContent = message;
            }
        }

        /*
         * Cartes d'articles
         */

        function createItemCard(item) {
            const category =
                CATEGORIES[item.category] || {
                    icon: '📦',
                    label: 'Autre'
                };

            const quantity = Math.max(
                1,
                Number(item.qty) || 1
            );

            const acquired = Math.min(
                quantity,
                Math.max(0, Number(item.got) || 0)
            );

            const completed = acquired >= quantity;
            const totalEstimatedPrice =
                quantity * (Number(item.unit) || 0);

            return `
                <article
                    class="rounded-3xl border border-emerald-100 bg-white p-4 shadow-sm"
                    data-item-id="${escapeHtml(item.id)}"
                >
                    <div class="flex gap-3">

                        <button
                            type="button"
                            data-action="toggle-completed"
                            aria-label="${
                                completed
                                    ? 'Marquer comme non terminé'
                                    : 'Marquer comme terminé'
                            }"
                            class="focus-visible mt-1 grid h-7 w-7 shrink-0 place-items-center rounded-full border-2 border-emerald-700 ${
                                completed
                                    ? 'bg-emerald-700 text-white'
                                    : 'bg-white'
                            }"
                        >
                            ${completed ? '✓' : ''}
                        </button>

                        <div class="min-w-0 flex-1">

                            <div class="flex items-start justify-between gap-3">

                                <div class="min-w-0">
                                    <h3
                                        class="font-black text-slate-800 ${
                                            completed
                                                ? 'line-through opacity-50'
                                                : ''
                                        }"
                                    >
                                        ${escapeHtml(item.name)}
                                    </h3>

                                    <p class="mt-1 text-xs text-slate-500">
                                        ${category.icon}
                                        ${category.label}
                                        •
                                        ${escapeHtml(item.timing)}
                                    </p>
